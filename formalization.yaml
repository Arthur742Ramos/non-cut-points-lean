  "fidelity": {
    "divergences": "Uses arbitrary compact connected subsets of a Hausdorff space, with no metric, local connectedness, path connectedness, or ambient CompactSpace premise. Removal in the first theorem is individual, not simultaneous. The second statement uses an explicit non-cut predicate and also permits singleton C. Its proof only needs connectedness of K; compactness of K is retained in the selected subcontinuum statement. The singleton union case of Proposition 29.1 is proved locally. Zorn orders oriented tails by reverse inclusion; a point in a chain intersection supplies another tail as a lower bound. Cut sides themselves are never assumed connected."
  },
